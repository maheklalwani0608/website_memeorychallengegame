<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Challenge - Words</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#6a11cb,#2575fc);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.card{
width:600px;
padding:35px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
border-radius:20px;
text-align:center;
color:white;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.words{
font-size:35px;
font-weight:bold;
letter-spacing:3px;
margin:30px 0;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
font-size:18px;
text-align:center;
}

button{
margin-top:20px;
padding:14px 35px;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
background:#FFD700;
cursor:pointer;
}

button:hover{
transform:scale(1.05);
}

#answerForm{
display:none;
}

</style>

<script>

function hideWords(){

document.getElementById("wordBox").style.display="none";

document.getElementById("answerForm").style.display="block";

}

setTimeout(hideWords,5000);

</script>

</head>

<body>

<div class="card">

<h1>📝 Word Memory Challenge</h1>

<p>Memorize these words. They will disappear after 5 seconds.</p>

<div id="wordBox" class="words">

{{ words[0] }} &nbsp;

{{ words[1] }} &nbsp;

{{ words[2] }} &nbsp;

{{ words[3] }}

</div>

<form id="answerForm" action="/check_words" method="POST">

<input type="text" name="word1" placeholder="Word 1" required>

<input type="text" name="word2" placeholder="Word 2" required>

<input type="text" name="word3" placeholder="Word 3" required>

<input type="text" name="word4" placeholder="Word 4" required>

<button type="submit">Submit</button>

</form>

</div>

</body>
</html>
