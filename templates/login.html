<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Challenge - Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(-45deg,#5b2be0,#2575fc,#7b2ff7,#00c6ff);
    background-size:400% 400%;
    animation:bgAnimation 10s ease infinite;
    perspective:1200px;
}

@keyframes bgAnimation{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* Floating Memory Icons */

.icon{
    position:absolute;
    font-size:42px;
    animation:float 6s ease-in-out infinite;
    opacity:.9;
}

.icon:nth-child(1){
    top:8%;
    left:8%;
}

.icon:nth-child(2){
    top:12%;
    right:10%;
    animation-delay:1s;
}

.icon:nth-child(3){
    bottom:10%;
    left:8%;
    animation-delay:2s;
}

.icon:nth-child(4){
    bottom:12%;
    right:8%;
    animation-delay:3s;
}

.icon:nth-child(5){
    top:50%;
    left:4%;
    animation-delay:4s;
}

.icon:nth-child(6){
    top:50%;
    right:4%;
    animation-delay:5s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0px) rotate(0deg);
    }
    50%{
        transform:translateY(-25px) rotate(12deg);
    }
}

/* Glass Login Card */

.container{

    width:430px;

    padding:35px;

    border-radius:25px;

    background:rgba(255,255,255,.15);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.25);

    box-shadow:0 25px 50px rgba(0,0,0,.35);

    transform-style:preserve-3d;

    transition:.5s;

    text-align:center;

}

.container:hover{

    transform:rotateX(6deg) rotateY(-6deg) scale(1.03);

}

h1{

    color:white;

    font-size:34px;

    margin-bottom:8px;

    text-shadow:0 0 20px rgba(255,255,255,.6);

}

.subtitle{

    color:#f1f1f1;

    margin-bottom:25px;

}

label{

    display:block;

    text-align:left;

    color:white;

    margin:12px 0 6px;

    font-weight:bold;

}

input{

    width:100%;

    padding:14px;

    border:none;

    border-radius:12px;

    background:rgba(255,255,255,.18);

    color:white;

    outline:none;

    font-size:16px;

    transition:.3s;

}

input::placeholder{

    color:#f2f2f2;

}

input:focus{

    background:rgba(255,255,255,.28);

    box-shadow:0 0 18px #87cefa;

    transform:translateY(-2px);

}

button{

    width:100%;

    margin-top:22px;

    padding:14px;

    border:none;

    border-radius:14px;

    background:linear-gradient(45deg,#00d084,#00b36b);

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:.3s;

    box-shadow:0 10px 25px rgba(0,208,132,.5);

}

button:hover{

    transform:translateY(-4px) scale(1.04);

    box-shadow:0 18px 35px rgba(0,208,132,.7);

}

.link{

    margin-top:18px;

    color:white;

}

.link a{

    color:#FFD700;

    text-decoration:none;

    font-weight:bold;

}

.link a:hover{

    text-decoration:underline;

}

</style>

</head>

<body>

<div class="icon">🧠</div>
<div class="icon">🧩</div>
<div class="icon">🃏</div>
<div class="icon">🔢</div>
<div class="icon">🎮</div>
<div class="icon">💡</div>

<div class="container">

<h1>🧠 Memory Challenge</h1>

<p class="subtitle">
Login to Continue Your Memory Journey
</p>

<form action="/login" method="POST">

<label>Enter Email</label>

<input
type="email"
name="email"
placeholder="Enter your Email"
required>

<label>Password</label>

<input
type="password"
name="password"
placeholder="Enter your Password"
required>
<button type="submit">
    🚀 Login
</button>

</form>

<div class="link">
    Don't have an account?
    <a href="/register">Register</a>
</div>

</div>

</body>
</html>
