<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Challenge</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#dbeafe,#f0f9ff,#eef2ff);
    overflow:hidden;
}

body::before{
    content:"";
    position:absolute;
    width:250px;
    height:250px;
    background:#93c5fd;
    border-radius:50%;
    top:-60px;
    left:-60px;
    filter:blur(70px);
    animation:float 8s ease-in-out infinite;
}

body::after{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    background:#c4b5fd;
    border-radius:50%;
    bottom:-50px;
    right:-50px;
    filter:blur(70px);
    animation:float 9s ease-in-out infinite alternate;
}

@keyframes float{
    from{transform:translateY(0);}
    to{transform:translateY(40px);}
}

.game-container{
    width:850px;
    padding:40px;
    border-radius:30px;
    background:rgba(255,255,255,.65);
    backdrop-filter:blur(15px);
    box-shadow:0 15px 40px rgba(0,0,0,.15);
    text-align:center;
    animation:fade .8s ease;
    position:relative;
    z-index:1;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h1{
    font-size:42px;
    color:#2563eb;
    margin-bottom:15px;
}

h2{
    color:#444;
    margin-bottom:15px;
}

#timer{
    font-size:28px;
    color:#ef4444;
    font-weight:bold;
    margin-bottom:35px;
}

#number-box{
    display:flex;
    justify-content:center;
    gap:25px;
    margin-bottom:40px;
}

.number{
    width:120px;
    height:120px;
    border-radius:22px;
    background:linear-gradient(135deg,#60a5fa,#6366f1);
    color:white;
    font-size:42px;
    font-weight:bold;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 10px 25px rgba(59,130,246,.35);
    transition:.4s;
    animation:pop .6s;
}

.number:hover{
    transform:translateY(-10px) scale(1.05);
    box-shadow:0 18px 35px rgba(99,102,241,.45);
}

@keyframes pop{
    from{
        transform:scale(.5);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

input{
    width:120px;
    height:55px;
    margin:10px;
    border:none;
    outline:none;
    border-radius:15px;
    text-align:center;
    font-size:22px;
    background:#f8fafc;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    transition:.3s;
}

input:focus{
    transform:scale(1.05);
    box-shadow:0 0 15px #60a5fa;
}

button{
    margin-top:25px;
    padding:15px 45px;
    border:none;
    border-radius:15px;
    background:linear-gradient(135deg,#3b82f6,#6366f1);
    color:white;
    font-size:20px;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 10px 20px rgba(59,130,246,.35);
}

button:hover{
    transform:translateY(-4px);
    box-shadow:0 15px 30px rgba(59,130,246,.45);
}

button:active{
    transform:scale(.96);
}

</style>

</head>
</head>
<body>

<div class="game-container">

    <h1>Memory Challenge</h1>

    <h2>Level {{ level }}</h2>

    <h3 id="timer">Time Left: 15</h3>

    <div id="number-box">

        {% for num in numbers %}
            <div class="number">{{ num }}</div>
        {% endfor %}

    </div>

    <form action="{{ url_for('check') }}" method="POST" id="answer-form" style="display:none;">

        <input type="text" name="num1" placeholder="Number 1" required>

        <input type="text" name="num2" placeholder="Number 2" required>

        <input type="text" name="num3" placeholder="Number 3" required>

        <input type="text" name="num4" placeholder="Number 4" required>

        <br><br>

        <button type="submit">Submit</button>

    </form>

</div>

<script>
let timeLeft = 15;

let timer = document.getElementById("timer");
let numberBox = document.getElementById("number-box");
let answerForm = document.getElementById("answer-form");

let countdown = setInterval(function () {

    timer.innerHTML = "Time Left: " + timeLeft;

    timeLeft--;

    if (timeLeft < 0) {

        clearInterval(countdown);

        numberBox.style.display = "none";

        timer.innerHTML = "Time's Up!";

        answerForm.style.display = "block";
    }

}, 1000);
</script>

</body>
</html>
