<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Challenge - Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(-45deg,#5b2be0,#2575fc,#7b2ff7,#00c6ff);
    background-size:400% 400%;
    animation:bgAnimation 10s ease infinite;
    perspective:1200px;
}

@keyframes bgAnimation{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.icon{
    position:absolute;
    font-size:42px;
    animation:float 6s ease-in-out infinite;
}

.icon:nth-child(1){top:8%;left:8%;}
.icon:nth-child(2){top:12%;right:10%;animation-delay:1s;}
.icon:nth-child(3){bottom:10%;left:8%;animation-delay:2s;}
.icon:nth-child(4){bottom:12%;right:8%;animation-delay:3s;}
.icon:nth-child(5){top:50%;left:4%;animation-delay:4s;}
.icon:nth-child(6){top:50%;right:4%;animation-delay:5s;}

@keyframes float{
    0%,100%{
        transform:translateY(0) rotate(0deg);
    }
    50%{
        transform:translateY(-25px) rotate(10deg);
    }
}

.container{
    width:450px;
    padding:35px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(18px);
    border-radius:25px;
    border:1px solid rgba(255,255,255,.25);
    box-shadow:0 25px 50px rgba(0,0,0,.35);
    transition:.5s;
    text-align:center;
}

.container:hover{
    transform:rotateX(6deg) rotateY(-6deg) scale(1.03);
}

h1{
    color:white;
    font-size:32px;
    margin-bottom:10px;
    text-shadow:0 0 15px rgba(255,255,255,.6);
}

.subtitle{
    color:#f1f1f1;
    margin-bottom:22px;
}

label{
    display:block;
    text-align:left;
    color:white;
    font-weight:bold;
    margin-top:12px;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:13px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,.18);
    color:white;
    outline:none;
    transition:.3s;
}

input::placeholder{
    color:#f1f1f1;
}

input:focus{
    background:rgba(255,255,255,.28);
    box-shadow:0 0 18px #87cefa;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:none;
    border-radius:14px;
    background:linear-gradient(45deg,#14e44c,#119c46);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 10px 25px rgba(208,0,121,.45);
}

button:hover{
    transform:translateY(-4px) scale(1.03);
    box-shadow:0 18px 35px rgba(208,0,121,.65);
}

.link{
    margin-top:18px;
    color:white;
}

.link a{
    color:#FFD700;
    text-decoration:none;
    font-weight:bold;
}

.link a:hover{
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="icon">🧠</div>
<div class="icon">🧩</div>
<div class="icon">🃏</div>
<div class="icon">🔢</div>
<div class="icon">🎮</div>
<div class="icon">💡</div>

<div class="container">

<h1>🧠 Memory Challenge</h1>

<p class="subtitle">Create Your Account</p>

<form action="/register" method="POST">

<label>Username</label>
<input type="text" name="username" placeholder="Enter Username" required>

<label>Email</label>
<input type="email" name="email" placeholder="Enter Email" required>

<label>Password</label>
<input type="password" name="password" placeholder="Enter Password" required>

<label>Confirm Password</label>
<input type="password" name="confirm_password" placeholder="Confirm Password" required>
<button type="submit">
    🚀 Register
</button>

</form>

<div class="link">
    Already have an account?
    <a href="/login">Login</a>
</div>

</div>

</body>
</html>
